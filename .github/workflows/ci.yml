name: CI

on:
  push:
    branches: [ main, fix/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21
      - name: Run gofmt check
        run: |
          gofmt -l .
      - name: Run go vet
        run: |
          go vet ./...
      - name: Run tests
        run: |
          go test ./... -v
